[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spacer-mc"
version = "0.0.1"
description = "Monte Carlo uncertainty propagation for rectal-spacer dose sparing in prostate radiotherapy"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
sensitivity = ["SALib>=1.5"]
dev = ["pytest>=8", "ruff>=0.5", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
