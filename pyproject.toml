[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spacer-mc"
version = "0.2.0"
description = "4D Monte Carlo uncertainty propagation for hydrogel rectal-spacer dose sparing in prostate radiotherapy"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.scripts]
spacer-mc = "spacer_mc.cli:main"

[project.optional-dependencies]
sensitivity = ["SALib>=1.5"]
dev = ["pytest>=8", "ruff>=0.5", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
